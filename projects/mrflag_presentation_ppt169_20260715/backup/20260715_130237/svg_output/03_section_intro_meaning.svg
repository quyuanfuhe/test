<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="section">
  <defs>
    <radialGradient id="bgGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chapterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06D6D0"/>
    </linearGradient>
  </defs>

  <g id="background">
    <rect width="1280" height="720" fill="#0A0E17"/>
    <rect width="1280" height="720" fill="url(#bgGlow)"/>
  </g>

  <g id="chapter-header">
    <text x="100" y="200" font-family="Consolas, 'Courier New', monospace" font-size="80" font-weight="bold" fill="#3B82F6" fill-opacity="0.15">01</text>
    <text x="100" y="300" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="52" font-weight="bold" fill="#E2E8F0">项目介绍与意义</text>
    <rect x="100" y="330" width="200" height="3" rx="1.5" fill="url(#chapterGrad)"/>
  </g>

  <g id="chapter-contents">
    <text x="100" y="410" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" fill="#94A3B8">本板块涵盖以下内容：</text>

    <g transform="translate(100, 450)">
      <circle cx="0" cy="6" r="4" fill="#3B82F6"/>
      <text x="24" y="13" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" fill="#E2E8F0">项目背景</text>
      <text x="24" y="45" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#64748B">开发工具与环境、目标受众分析</text>
    </g>

    <g transform="translate(100, 530)">
      <circle cx="0" cy="6" r="4" fill="#06D6D0"/>
      <text x="24" y="13" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" fill="#E2E8F0">项目介绍</text>
      <text x="24" y="45" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#64748B">游戏核心玩法、主要功能概述</text>
    </g>

    <g transform="translate(100, 610)">
      <circle cx="0" cy="6" r="4" fill="#8B5CF6"/>
      <text x="24" y="13" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" fill="#E2E8F0">项目意义</text>
      <text x="24" y="45" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#64748B">项目本身的价值与团队成员的个人收获</text>
    </g>
  </g>

  <g id="page-number">
    <text x="1220" y="700" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#64748B" text-anchor="end">03</text>
  </g>
</svg>
