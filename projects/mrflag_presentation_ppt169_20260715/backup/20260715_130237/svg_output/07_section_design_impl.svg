    </g>
    <g transform="translate(100, 550)">
      <circle cx="0" cy="6" r="4" fill="#8B5CF6"/>
      <text x="24" y="13" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" fill="#E2E8F0">需求分析与设计文档</text>
    </g>
    <g transform="translate(100, 600)">
      <circle cx="0" cy="6" r="4" fill="#10B981"/>
      <text x="24" y="13" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" fill="#E2E8F0">最终实现</text>
    </g>
