<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <defs>
    <radialGradient id="bgGlow" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06D6D0"/>
    </linearGradient>
  </defs>

  <g id="background">
    <rect width="1280" height="720" fill="#0A0E17"/>
    <rect width="1280" height="720" fill="url(#bgGlow)"/>
  </g>

  <g id="header">
    <text x="100" y="60" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="36" font-weight="bold" fill="#E2E8F0">游戏流程与构筑要素</text>
    <rect x="100" y="78" width="80" height="2" rx="1" fill="url(#dividerGrad)"/>
  </g>

  <!-- Game flow -->
  <g id="flow-section">
    <text x="100" y="125" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="bold" fill="#3B82F6">游戏流程</text>

    <g transform="translate(80, 155)">
      <rect x="0" y="0" width="200" height="70" rx="6" fill="#111827" stroke="#3B82F6" stroke-opacity="0.5" stroke-width="1"/>
      <text x="100" y="32" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#E2E8F0" text-anchor="middle">主菜单</text>
      <text x="100" y="55" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">MainMenu</text>
      <polygon points="210,29 220,35 210,41" fill="#3B82F6" fill-opacity="0.5"/>
    </g>
    <g transform="translate(310, 155)">
      <rect x="0" y="0" width="200" height="70" rx="6" fill="#111827" stroke="#06D6D0" stroke-opacity="0.5" stroke-width="1"/>
      <text x="100" y="32" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#E2E8F0" text-anchor="middle">选择模式</text>
      <text x="100" y="55" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Host / Join / Solo</text>
      <polygon points="210,29 220,35 210,41" fill="#06D6D0" fill-opacity="0.5"/>
    </g>
    <g transform="translate(540, 155)">
      <rect x="0" y="0" width="200" height="70" rx="6" fill="#111827" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1"/>
      <text x="100" y="32" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#E2E8F0" text-anchor="middle">地图选择</text>
      <text x="100" y="55" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">MapSelect</text>
      <polygon points="210,29 220,35 210,41" fill="#8B5CF6" fill-opacity="0.5"/>
    </g>
    <g transform="translate(770, 155)">
      <rect x="0" y="0" width="200" height="70" rx="6" fill="#111827" stroke="#F59E0B" stroke-opacity="0.5" stroke-width="1"/>
      <text x="100" y="32" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#E2E8F0" text-anchor="middle">游戏对战</text>
      <text x="100" y="55" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">MRGame / MultiGame</text>
      <polygon points="210,29 220,35 210,41" fill="#F59E0B" fill-opacity="0.5"/>
    </g>
    <g transform="translate(1000, 155)">
      <rect x="0" y="0" width="200" height="70" rx="6" fill="#111827" stroke="#10B981" stroke-opacity="0.5" stroke-width="1"/>
      <text x="100" y="32" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#E2E8F0" text-anchor="middle">显示得分</text>
      <text x="100" y="55" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">返回主菜单</text>
    </g>
  </g>

  <!-- Building blocks -->
  <g id="building-blocks">
    <text x="100" y="300" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="bold" fill="#3B82F6">构筑要素</text>

    <rect x="100" y="325" width="250" height="180" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text x="125" y="360" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#3B82F6">OBJECTS</text>
    <text x="125" y="390" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" font-weight="bold" fill="#E2E8F0">场景物体</text>
    <text x="125" y="420" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#94A3B8">Wall / Box / Pillar</text>
    <text x="125" y="445" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#94A3B8">Barrel / Ramp / Sphere</text>

    <rect x="380" y="325" width="250" height="180" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text x="405" y="360" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#F59E0B">FLAGS</text>
    <text x="405" y="390" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" font-weight="bold" fill="#E2E8F0">旗帜系统</text>
    <text x="405" y="420" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#94A3B8">Gold / Red / White</text>
    <text x="405" y="445" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#94A3B8">抓取得分 + 重生机制</text>

    <rect x="660" y="325" width="250" height="180" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text x="685" y="360" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#06D6D0">PLAYERS</text>
    <text x="685" y="390" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" font-weight="bold" fill="#E2E8F0">玩家系统</text>
    <text x="685" y="420" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#94A3B8">LocalPlayer 发送位置</text>
    <text x="685" y="445" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#94A3B8">RemotePlayer 接收插值</text>

    <rect x="940" y="325" width="250" height="180" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text x="965" y="360" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#8B5CF6">UI</text>
    <text x="965" y="390" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" font-weight="bold" fill="#E2E8F0">界面系统</text>
    <text x="965" y="420" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#94A3B8">JoinPanel · 主菜单</text>
    <text x="965" y="445" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#94A3B8">MapSelect · 得分</text>
  </g>

  <g id="page-number">
    <text x="1220" y="700" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#64748B" text-anchor="end">08</text>
  </g>
</svg>
