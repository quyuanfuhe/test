    <text x="50" y="57" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#3B82F6" text-anchor="middle">M1</text>
    <text x="100" y="55" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="bold" fill="#E2E8F0">[ 成员姓名 ]</text>
    <rect x="20" y="100" width="500" height="130" rx="6" fill="#0A0E17" stroke="#1E293B" stroke-width="1" stroke-dasharray="6,4"/>
