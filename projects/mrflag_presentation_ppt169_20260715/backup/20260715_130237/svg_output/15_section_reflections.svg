<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="section">
  <defs>
    <radialGradient id="bgGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chapterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06D6D0"/>
    </linearGradient>
  </defs>

  <g id="background">
    <rect width="1280" height="720" fill="#0A0E17"/>
    <rect width="1280" height="720" fill="url(#bgGlow)"/>
  </g>

  <g id="chapter-header">
    <text x="100" y="200" font-family="Consolas, 'Courier New', monospace" font-size="80" font-weight="bold" fill="#10B981" fill-opacity="0.12">04</text>
    <text x="100" y="300" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="52" font-weight="bold" fill="#E2E8F0">思考与收获</text>
    <rect x="100" y="330" width="200" height="3" rx="1.5" fill="url(#chapterGrad)"/>
  </g>

  <g id="chapter-contents">
    <text x="100" y="410" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" fill="#94A3B8">本板块涵盖以下内容：</text>

    <g transform="translate(100, 460)">
      <circle cx="0" cy="6" r="4" fill="#3B82F6"/>
      <text x="24" y="13" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" fill="#E2E8F0">技术与管理收获</text>
      <text x="24" y="42" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#64748B">项目全过程的经验沉淀与能力提升</text>
    </g>

    <g transform="translate(100, 550)">
      <circle cx="0" cy="6" r="4" fill="#06D6D0"/>
      <text x="24" y="13" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="22" fill="#E2E8F0">未来展望</text>
      <text x="24" y="42" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#64748B">项目的持续优化方向与扩展可能性</text>
    </g>
  </g>

  <g id="page-number">
    <text x="1220" y="700" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#64748B" text-anchor="end">15</text>
  </g>
</svg>
