<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <g id="background">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <text x="80" y="60" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="36" font-weight="bold" fill="#0F172A">开发计划</text>
    <rect x="80" y="78" width="60" height="4" fill="#2563EB"/>
  </g>

  <g id="timeline">
    <line x1="120" y1="130" x2="120" y2="620" stroke="#E2E8F0" stroke-width="3"/>

    <circle cx="120" cy="175" r="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
    <rect x="160" y="143" width="1000" height="56" fill="#F1F5F9"/>
    <rect x="160" y="143" width="4" height="56" fill="#2563EB"/>
    <text x="180" y="168" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#2563EB">PHASE 1</text>
    <text x="180" y="188" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#0F172A">Unity 项目搭建 + Pico SDK 集成 + 基础 MR 环境配置</text>

    <circle cx="120" cy="270" r="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="3"/>
    <rect x="160" y="238" width="1000" height="56" fill="#F1F5F9"/>
    <rect x="160" y="238" width="4" height="56" fill="#0D9488"/>
    <text x="180" y="263" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#0D9488">PHASE 2</text>
    <text x="180" y="283" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#0F172A">单人游戏模式实现 — MRGame 场景 + MRFlag 旗帜系统</text>

    <circle cx="120" cy="365" r="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>
    <rect x="160" y="333" width="1000" height="56" fill="#F1F5F9"/>
    <rect x="160" y="333" width="4" height="56" fill="#7C3AED"/>
    <text x="180" y="358" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7C3AED">PHASE 3</text>
    <text x="180" y="378" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#0F172A">Go 后端搭建 — HTTP REST / WebSocket / UDP 三层服务</text>

    <circle cx="120" cy="460" r="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3"/>
    <rect x="160" y="428" width="1000" height="56" fill="#F1F5F9"/>
    <rect x="160" y="428" width="4" height="56" fill="#F59E0B"/>
    <text x="180" y="453" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#F59E0B">PHASE 4</text>
    <text x="180" y="473" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#0F172A">双人联机模式实现 — MultiGame 场景 + 网络同步</text>

    <circle cx="120" cy="555" r="8" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>
    <rect x="160" y="523" width="1000" height="56" fill="#F1F5F9"/>
    <rect x="160" y="523" width="4" height="56" fill="#10B981"/>
    <text x="180" y="548" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#10B981">PHASE 5</text>
    <text x="180" y="568" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#0F172A">地图编辑器开发 — XR 控制器交互 + 地图存储与同步</text>

    <circle cx="120" cy="640" r="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/>
    <rect x="160" y="595" width="1000" height="56" fill="#F1F5F9"/>
    <text x="180" y="620" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#94A3B8">PHASE 6</text>
    <text x="180" y="640" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#0F172A">模型替换 · UI 优化 · Bug 修复 · Addressables 构建</text>
  </g>

  <g id="page-number">
    <text x="1220" y="695" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="end">09</text>
